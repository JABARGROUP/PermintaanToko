<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat...</title>
    
    <!-- Meta Refresh Fallback -->
    <meta http-equiv="refresh" content="0; url=https://polytasik-pixel.github.io/permintaanToko/">
    <link rel="canonical" href="https://polytasik-pixel.github.io/permintaanToko/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Loading Spinner */
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Loading Muter -->
    <div class="spinner"></div>

    <script>
        // Mengalihkan langsung ke link tujuan baru
        window.location.replace("https://polytasik-pixel.github.io/permintaanToko/");
    </script>
</body>
</html>
