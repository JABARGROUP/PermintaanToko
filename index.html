<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Tag Anti-Cache untuk Mencegah Browser Menggunakan Pengalihan Lama -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Permintaan Toko - SSO Redirector</title>
    <style>
        html, body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        .redirect-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-left-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        p {
            margin: 0;
            font-size: 13.5px;
            color: #94a3b8;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- Master Redirector Script dengan Supabase SSO JWT Parser & Cache Buster -->
    <script src="app.js?v=20260910_NO_CACHE_REDIRECT"></script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h2>Permintaan Toko</h2>
        <p>Mengarahkan Anda ke aplikasi & memproses SSO Supabase...</p>
    </div>

    <noscript>
        <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #333; background: #fff; height: 100vh;">
            <h2>Permintaan Toko</h2>
            <p>JavaScript tidak aktif. Silakan pilih versi yang sesuai dengan perangkat Anda:</p>
            <p><a href="https://polytasik-pixel.github.io/permintaanToko/">📱 Versi HP (Smartphone)</a></p>
            <p><a href="https://polytasik-pixel.github.io/permintaanTokoo/">💻 Versi Laptop / PC</a></p>
        </div>
    </noscript>
</body>
</html>
